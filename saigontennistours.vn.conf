# =========================================================================
# CẤU HÌNH NGINX TRÊN VPS HOST CHO DOMAIN: saigontennistours.vn (HTTP - CHƯA SSL)
# Đường dẫn khuyến nghị trên VPS: /etc/nginx/sites-available/saigontennistours.vn
# (Nginx sẽ chạy trực tiếp trên cổng 80. Khi nào cài SSL sau bằng Certbot,
#  file này sẽ tự động được Certbot cập nhật lên cấu hình HTTPS bảo mật).
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name saigontennistours.vn www.saigontennistours.vn;

    # Cấu hình Client body size lớn để upload ảnh/video giải đấu (Backend giới hạn max 80MB)
    client_max_body_size 100M;

    # Phục vụ xác thực tự động của Let's Encrypt (Certbot) khi cài đặt SSL sau này
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy toàn bộ request vào container Frontend Nginx Gateway (Đang chạy cổng 3012 của VPS)
    location / {
        proxy_pass http://127.0.0.1:3012;
        
        # Thiết lập các Header Proxy chuẩn xác
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Cấu hình cực kỳ quan trọng để hỗ trợ WebSockets (Tính năng Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Tăng thời gian timeout cho kết nối WebSocket Chat bền vững
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
