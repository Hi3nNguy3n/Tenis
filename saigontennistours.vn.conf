# =========================================================================
# CẤU HÌNH NGINX TRÊN VPS HOST CHO DOMAIN: saigontennistours.vn (HTTPS)
# Đường dẫn khuyến nghị trên VPS: /etc/nginx/sites-available/saigontennistours.vn
# Nếu Certbot tạo tên folder khác, kiểm tra bằng: ls /etc/letsencrypt/live
# =========================================================================

limit_req_zone $binary_remote_addr zone=tennis_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tennis_auth:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=tennis_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name saigontennistours.vn www.saigontennistours.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saigontennistours.vn www.saigontennistours.vn;

    ssl_certificate /etc/letsencrypt/live/saigontennistours.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saigontennistours.vn/privkey.pem;

    # Cấu hình Client body size lớn để upload ảnh/video giải đấu (Backend giới hạn max 80MB)
    client_max_body_size 100M;
    limit_conn tennis_conn 40;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=tennis_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/chat/ {
        limit_req zone=tennis_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    location /api/ {
        limit_req zone=tennis_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy toàn bộ request vào container Frontend Nginx Gateway (Đang chạy cổng 3012 của VPS)
    location / {
        proxy_pass http://127.0.0.1:3012;
        
        # Thiết lập các Header Proxy chuẩn xác
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Cấu hình cực kỳ quan trọng để hỗ trợ WebSockets (Tính năng Chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Tăng thời gian timeout cho kết nối WebSocket Chat bền vững
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
