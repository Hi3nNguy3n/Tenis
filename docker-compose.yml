services:
  db:
    image: postgres:15-alpine
    container_name: tennis_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@123
      POSTGRES_DB: DB_saigontenis
    # Không cần map cổng ra host VPS để tránh xung đột cổng và tăng bảo mật.
    # Các service nội bộ vẫn kết nối qua port 5432 trong Docker Network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DB_saigontenis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tennis_backend
    restart: always
    environment:
      - PORT=8000
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - RATE_LIMIT_REQUESTS_PER_MINUTE=180
      - RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE=30
      - UVICORN_LIMIT_CONCURRENCY=1000
      - REDIS_URL=${REDIS_URL}
    env_file:
      - ./backend/.env
    # Không map cổng 8000 ra host để tránh xung đột. Nginx trong container frontend sẽ proxy nội bộ.
    depends_on:
      db:
        condition: service_healthy

  chat_service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    container_name: tennis_chat_service
    restart: always
    environment:
      - PORT=8001
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - RATE_LIMIT_REQUESTS_PER_MINUTE=240
      - UVICORN_LIMIT_CONCURRENCY=1000
    env_file:
      - ./chat_service/.env
    # Không map cổng 8001 ra host để tránh xung đột. Nginx trong container frontend sẽ proxy nội bộ.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Sử dụng relative paths để Nginx Gateway điều phối tự động mà không bị lỗi CORS
        - VITE_API_BASE_URL=
        - VITE_API_CHAT_URL=
        # Để trống để frontend tự dùng ws/wss theo domain hiện tại.
        - VITE_WS_CHAT_URL=
    container_name: tennis_frontend
    restart: always
    ports:
      # Map cổng 80 của container ra cổng rảnh 3012 của host VPS để tránh trùng với các container khác (như 3011, 3010, 3004, 3005...)
      - "3012:80"
    depends_on:
      - backend
      - chat_service

volumes:
  postgres_data:
